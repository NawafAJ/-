<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أذكاري">
<meta name="theme-color" content="#1a1208">
<title>أذكاري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-light: #f0d080;
    --gold-mid: #c9973a;
    --gold-dark: #8a6520;
    --gold-deep: #5c4010;
    --bg-deep: #0e0b05;
    --bg-card: #17120a;
    --bg-card2: #1f1810;
    --border-gold: rgba(192,148,58,0.25);
    --border-gold-strong: rgba(192,148,58,0.5);
    --text-gold: #e8c46a;
    --text-gold-soft: #b8944a;
    --text-cream: #f5ead8;
    --text-muted: #7a6840;
    --done-bg: #0d1a0d;
    --done-border: rgba(80,160,80,0.3);
    --done-text: #5fba5f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    font-family: 'Amiri', serif;
    color: var(--text-cream);
    overflow-x: hidden;
  }

  /* Ornamental background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(192,148,58,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 100%, rgba(192,148,58,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    padding-bottom: 80px;
  }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, #0e0b05 80%, transparent);
    padding: 52px 20px 16px;
    text-align: center;
  }

  .header-ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .ornament-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
    max-width: 60px;
  }

  .ornament-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold-mid);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .app-title {
    font-family: 'Scheherazade New', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(192,148,58,0.4);
    line-height: 1.2;
  }

  .app-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* ── Progress Summary ── */
  .progress-summary {
    margin: 0 20px 20px;
    background: var(--bg-card2);
    border: 1px solid var(--border-gold-strong);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .progress-ring-wrap {
    position: relative;
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }

  .progress-ring {
    transform: rotate(-90deg);
  }

  .ring-bg { fill: none; stroke: var(--gold-deep); stroke-width: 4; }
  .ring-fill { fill: none; stroke: var(--gold-mid); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold-light);
  }

  .progress-label {
    flex: 1;
  }

  .progress-label strong {
    display: block;
    font-size: 15px;
    color: var(--text-cream);
    font-family: 'Scheherazade New', serif;
  }

  .progress-label span {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── Dhikr Cards ── */
  .cards-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dhikr-card {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 16px;
    transition: border-color 0.3s, background 0.3s, opacity 0.3s;
    position: relative;
    overflow: hidden;
  }

  .dhikr-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(180deg, var(--gold-mid), transparent);
    border-radius: 0 16px 16px 0;
  }

  .dhikr-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
    opacity: 0.75;
  }

  .dhikr-card.done::before {
    background: linear-gradient(180deg, var(--done-text), transparent);
  }

  .card-inner {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .card-content {
    flex: 1;
    min-width: 0;
  }

  .dhikr-number {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-family: monospace;
    border: 1px solid var(--border-gold);
    display: inline-block;
    padding: 1px 7px;
    border-radius: 20px;
  }

  .dhikr-text {
    font-family: 'Scheherazade New', serif;
    font-size: 16px;
    line-height: 1.85;
    color: var(--text-cream);
    transition: color 0.3s;
  }

  .dhikr-card.done .dhikr-text {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--done-border);
  }

  .repeat-tag {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-gold-soft);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .repeat-tag::before {
    content: '◈';
    font-size: 10px;
    color: var(--gold-dark);
  }

  /* ── Count Button ── */
  .count-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    width: 54px;
  }

  .tap-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1.5px solid var(--border-gold-strong);
    background: linear-gradient(145deg, #231a08, #1a1208);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 0 0 0 rgba(192,148,58,0);
    -webkit-user-select: none;
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .tap-btn:active {
    transform: scale(0.9);
  }

  .tap-btn.done-btn {
    border-color: var(--done-border);
    background: linear-gradient(145deg, #0d1a0d, #0a150a);
  }

  .btn-count {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1;
    font-family: monospace;
  }

  .btn-total {
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1;
    margin-top: 2px;
    font-family: monospace;
  }

  .btn-check {
    font-size: 22px;
    color: var(--done-text);
  }

  .btn-label {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

  .btn-label.done-label {
    color: var(--done-text);
  }

  /* Progress bar on card */
  .card-progress {
    margin-top: 10px;
    height: 3px;
    background: rgba(192,148,58,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .card-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-mid));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .dhikr-card.done .card-progress-fill {
    background: var(--done-text);
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: linear-gradient(0deg, var(--bg-deep) 70%, transparent);
    padding: 16px 24px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border-gold);
    color: var(--text-muted);
    font-family: 'Amiri', serif;
    font-size: 14px;
    padding: 10px 28px;
    border-radius: 30px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    letter-spacing: 0.5px;
  }

  .reset-btn:active {
    border-color: var(--gold-mid);
    color: var(--gold-light);
  }

  /* Pulse animation on tap */
  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(3); opacity: 0; }
  }

  .ripple-circle {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(192,148,58,0.3);
    animation: ripple 0.4s ease-out forwards;
    pointer-events: none;
  }

  /* All done state */
  .all-done-banner {
    display: none;
    text-align: center;
    padding: 20px;
    color: var(--gold-light);
    font-family: 'Scheherazade New', serif;
    font-size: 18px;
    letter-spacing: 1px;
  }

  .all-done-banner.show { display: block; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gold-deep); border-radius: 2px; }
</style>
</head>
<body>

<div class="app-wrap">

  <div class="header">
    <div class="header-ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line"></div>
    </div>
    <div class="app-title">أذكاري</div>
    <div class="app-subtitle">أذكار الصباح والمساء</div>
  </div>

  <div class="progress-summary">
    <div class="progress-ring-wrap">
      <svg class="progress-ring" width="56" height="56" viewBox="0 0 56 56">
        <circle class="ring-bg" cx="28" cy="28" r="24"/>
        <circle class="ring-fill" id="ringFill" cx="28" cy="28" r="24"
          stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
      </svg>
      <div class="ring-text" id="ringPct">0%</div>
    </div>
    <div class="progress-label">
      <strong id="summaryText">ابدأ أذكارك اليوم</strong>
      <span id="summaryDetail">لم تُكمَل أي ذكر بعد</span>
    </div>
  </div>

  <div class="cards-list" id="cardsList"></div>

  <div class="all-done-banner" id="allDoneBanner">
    ﷽<br>تقبّل الله منك 🌙
  </div>

</div>

<div class="bottom-bar">
  <button class="reset-btn" onclick="resetAll()">↺ &nbsp; إعادة تعيين اليوم</button>
</div>

<script>
const adhkar = [
  { id: 17, text: "بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", total: 3 },
  { id: 18, text: "أَسْأَلُ اللهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ — وَعِنْدَ الْقِرَاءَةِ عَلَى النَّفْسِ: (أَنْ يَشْفِيَنِي)", total: 7 },
  { id: 19, text: "بِسْمِ اللهِ … أَعُوذُ بِعِزَّةِ اللهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ", total: 7, alt: 3 },
  { id: 20, text: "أَعُوذُ بِوَجْهِ اللهِ الْعَظِيمِ الَّذِي لَيْسَ شَيْءٌ أَعْظَمُ مِنْهُ، وَبِكَلِمَاتِ اللهِ التَّامَّاتِ الَّتِي لَا يُجَاوِزُهُنَّ بَرٌّ وَلَا فَاجِرٌ مِنْ شَرِّ مَا خَلَقَ وَذَرَأَ وَبَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ وَمَا يَعْرُجُ فِيهَا، وَمِنْ شَرِّ مَا يَلِي فِي الْأَرْضِ وَمَا يَخْرُجُ مِنْهَا، وَمِنْ شَرِّ طَوَارِقِ اللَّيْلِ وَالنَّهَارِ إِلَّا طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ", total: 1 },
  { id: 21, text: "أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ السَّامَّةِ وَالْهَامَّةِ، وَأَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ عِقَابِهِ وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَنْ يَحْضُرُونِ", total: 1 },
  { id: 22, text: "بِسْمِ اللهِ أَرْقِيكَ مِنْ كُلِّ دَاءٍ يُؤْذِيكَ، وَمِنْ شَرِّ كُلِّ حَاسِدٍ وَعَيْنٍ، اللهُ يَشْفِيكَ بِسْمِ اللهِ أَرْقِيكَ", total: 1 },
  { id: 23, text: "اذْهَبِ الْبَأْسَ رَبَّ النَّاسِ، وَاشْفَ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا", total: 1 },
  { id: 24, text: "أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ", total: 1 },
  { id: 25, text: "حَسْبِيَ اللهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", total: 7 },
  { id: 26, text: "أَعُوذُ بِاللهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ", total: 3 },
  { id: 28, text: "اللَّهُمَّ احْفَظْ عَلَيَّ عَقْلِي وَدِينِي وَدُنْيَايَ، وَبِكَ يَا رَبِّ يَقِينِي، وَارْزُقْنِي رِزْقًا حَلَالًا كَثِيرًا يَكْفِيَنِي، وَابْعُدْ عَنِّي شَرَّ مَا يُؤْلِمُنِي وَيُؤْذِينِي، وَلَا تُحَوِّجْنِي لِطَبِيبٍ يُدَاوِينِي", total: 1 },
  { id: 29, text: "اللَّهُمَّ لَا تَكِلْنَا إِلَى أَنْفُسِنَا فَنَعْجِزَ، وَلَا إِلَى النَّاسِ فَنَذِلَّ", total: 3, alt: 1 },
  { id: 30, text: "اللَّهُمَّ إِنَّكَ قُلْتَ وَقَوْلُكَ الْحَقُّ: (ادْعُونِي أَسْتَجِبْ لَكُمْ)، اللَّهُمَّ هَذَا الدُّعَاءُ وَعَلَيْكَ الْإِجَابَةُ، وَهَذَا الْجُهْدُ وَعَلَيْكَ التُّكْلَانُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِكَ", total: 1 },
];

const KEY = 'adhkari_gold_v1';

function getMax(d) {
  if (d.alt) return Math.max(d.total, d.alt);
  return d.total;
}

function getLabel(d) {
  if (d.alt) return `${Math.min(d.total,d.alt)} أو ${Math.max(d.total,d.alt)} مرات`;
  if (d.total === 1) return 'مرة واحدة';
  return `${d.total} مرات`;
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e) { return {}; }
}

function saveState(s) {
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {}
}

let state = loadState();

function updateSummary() {
  const total = adhkar.length;
  let done = 0;
  adhkar.forEach(d => { if ((state[d.id]||0) >= getMax(d)) done++; });
  const pct = Math.round((done/total)*100);
  const circ = 150.8;
  const offset = circ - (circ * pct / 100);

  document.getElementById('ringFill').style.strokeDashoffset = offset;
  document.getElementById('ringPct').textContent = pct + '%';

  if (done === 0) {
    document.getElementById('summaryText').textContent = 'ابدأ أذكارك اليوم';
    document.getElementById('summaryDetail').textContent = 'لم يُكتمَل أي ذكر بعد';
  } else if (done === total) {
    document.getElementById('summaryText').textContent = 'أتممتَ جميع الأذكار';
    document.getElementById('summaryDetail').textContent = 'تقبّل الله منك 🌙';
    document.getElementById('allDoneBanner').classList.add('show');
  } else {
    document.getElementById('summaryText').textContent = `أُكمِل ${done} من أصل ${total}`;
    document.getElementById('summaryDetail').textContent = `تبقّى ${total - done} ذكر`;
    document.getElementById('allDoneBanner').classList.remove('show');
  }
}

function renderCards() {
  const list = document.getElementById('cardsList');
  list.innerHTML = '';

  adhkar.forEach(d => {
    const max = getMax(d);
    const cur = state[d.id] || 0;
    const isDone = cur >= max;
    const pct = Math.min(100, Math.round((cur/max)*100));

    const card = document.createElement('div');
    card.className = 'dhikr-card' + (isDone ? ' done' : '');
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-content">
          <div class="dhikr-number">ذكر ${d.id}</div>
          <div class="dhikr-text">${d.text}</div>
          <div class="repeat-tag">${getLabel(d)}</div>
          <div class="card-progress">
            <div class="card-progress-fill" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="count-side">
          <button class="tap-btn ${isDone ? 'done-btn' : ''}" onclick="tap(${d.id}, this)" aria-label="اضغط لتسجيل">
            ${isDone
              ? `<span class="btn-check">✓</span>`
              : `<span class="btn-count">${cur}</span><span class="btn-total">/${max}</span>`
            }
          </button>
          <span class="btn-label ${isDone ? 'done-label' : ''}">
            ${isDone ? 'تم ✓' : (cur === 0 ? 'اضغط' : `بقي ${max - cur}`)}
          </span>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  updateSummary();
}

function tap(id, btn) {
  const d = adhkar.find(a => a.id === id);
  const max = getMax(d);
  const cur = state[id] || 0;
  if (cur >= max) return;

  // Ripple
  const ripple = document.createElement('div');
  ripple.className = 'ripple-circle';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 400);

  state[id] = cur + 1;
  saveState(state);
  renderCards();

  // Scroll to next undone card after a delay
  if (state[id] >= max) {
    setTimeout(() => {
      const cards = document.querySelectorAll('.dhikr-card:not(.done)');
      if (cards.length > 0) cards[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
}

function resetAll() {
  if (confirm('هل تريد إعادة ضبط جميع الأذكار؟')) {
    state = {};
    saveState(state);
    document.getElementById('allDoneBanner').classList.remove('show');
    renderCards();
  }
}

renderCards();
</script>
