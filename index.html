<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أذكاري">
<meta name="theme-color" content="#1a1208">
<title>أذكاري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-light: #f0d080;
    --gold-mid: #c9973a;
    --gold-dark: #8a6520;
    --gold-deep: #5c4010;
    --bg-deep: #0e0b05;
    --bg-card: #17120a;
    --bg-card2: #1f1810;
    --border-gold: rgba(192,148,58,0.25);
    --border-gold-strong: rgba(192,148,58,0.5);
    --text-gold: #e8c46a;
    --text-gold-soft: #b8944a;
    --text-cream: #f5ead8;
    --text-muted: #7a6840;
    --done-bg: #0d1a0d;
    --done-border: rgba(80,160,80,0.3);
    --done-text: #5fba5f;
    --quran-accent: #e8d5b0;
    --quran-accent-soft: #a8926a;
    --quran-border: rgba(210,185,130,0.22);
    --quran-border-strong: rgba(210,185,130,0.42);
    --quran-bg: #100e08;
    --quran-bg-card: #1a1610;
    --morning-color: #f5c842;
    --evening-color: #7b9fd4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    font-family: 'Amiri', serif;
    color: var(--text-cream);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(192,148,58,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 100%, rgba(192,148,58,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: 30px;
  }

  /* ── Sticky Top Bar ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0e0b05;
    border-bottom: 1px solid var(--border-gold);
    padding: 12px 16px;
  }

  .top-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .title-center {
    flex: 1;
    text-align: center;
  }

  .app-title {
    font-family: 'Scheherazade New', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(192,148,58,0.4);
    line-height: 1.2;
  }

  .app-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .date-display {
    font-size: 12px;
    color: var(--text-gold-soft);
    margin-top: 2px;
    font-family: 'Amiri', serif;
  }

  /* ── Time Toggle ── */
  .time-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    background: var(--bg-card2);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 4px;
  }

  .time-btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 9px;
    font-family: 'Amiri', serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .time-btn.active.morning {
    background: linear-gradient(135deg, rgba(245,200,66,0.2), rgba(192,148,58,0.15));
    border: 1px solid rgba(245,200,66,0.4);
    color: var(--morning-color);
  }

  .time-btn.active.evening {
    background: linear-gradient(135deg, rgba(123,159,212,0.2), rgba(80,100,160,0.15));
    border: 1px solid rgba(123,159,212,0.4);
    color: var(--evening-color);
  }

  .time-btn.active.history-active {
    background: linear-gradient(135deg, rgba(192,148,58,0.15), rgba(140,100,30,0.1));
    border: 1px solid var(--border-gold-strong);
    color: var(--gold-light);
  }

  .time-btn .done-badge {
    font-size: 11px;
    background: rgba(95,186,95,0.2);
    border: 1px solid var(--done-border);
    color: var(--done-text);
    border-radius: 10px;
    padding: 1px 6px;
  }

  /* ── Progress Summary ── */
  .progress-summary {
    background: var(--bg-card2);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-ring-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .progress-ring { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--gold-deep); stroke-width: 4; }
  .ring-fill { fill: none; stroke: var(--gold-mid); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold-light);
  }

  .progress-label { flex: 1; }
  .progress-label strong {
    display: block;
    font-size: 13px;
    color: var(--text-cream);
    font-family: 'Scheherazade New', serif;
  }
  .progress-label span { font-size: 11px; color: var(--text-muted); }

  /* ── Section Headers ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 16px 14px;
  }

  .section-line {
    flex: 1;
    height: 1px;
  }

  .section-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 30px;
    font-family: 'Scheherazade New', serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* Quran section */
  .section-header.quran .section-line {
    background: linear-gradient(90deg, transparent, #a8926a, transparent);
  }
  .section-header.quran .section-title-wrap {
    background: rgba(210,185,130,0.07);
    border: 1px solid rgba(210,185,130,0.38);
    color: #e8d5b0;
  }
  .section-icon { font-size: 18px; }

  /* Sunnah section */
  .section-header.sunnah .section-line {
    background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
  }
  .section-header.sunnah .section-title-wrap {
    background: rgba(192,148,58,0.08);
    border: 1px solid var(--border-gold-strong);
    color: var(--gold-light);
  }

  /* ── Dhikr Cards ── */
  .cards-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dhikr-card {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 16px;
    transition: border-color 0.3s, background 0.3s, opacity 0.3s;
    position: relative;
    overflow: hidden;
  }

  .dhikr-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(180deg, var(--gold-mid), transparent);
    border-radius: 0 16px 16px 0;
  }

  .dhikr-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
    opacity: 0.75;
  }

  .dhikr-card.done::before {
    background: linear-gradient(180deg, var(--done-text), transparent);
  }

  /* Quran cards */
  .dhikr-card.quran-card {
    background: var(--quran-bg-card);
    border-color: var(--quran-border);
  }
  .dhikr-card.quran-card::before {
    background: linear-gradient(180deg, #e8d5b0, transparent);
  }
  .dhikr-card.quran-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }
  .dhikr-card.quran-card .dhikr-number {
    border-color: var(--quran-border-strong);
    color: var(--quran-accent-soft);
  }
  .dhikr-card.quran-card .dhikr-text {
    color: #f0e6cc;
  }
  .dhikr-card.quran-card .repeat-tag {
    color: var(--quran-accent-soft);
  }
  .dhikr-card.quran-card .repeat-tag::before {
    color: var(--quran-accent-soft);
  }
  .dhikr-card.quran-card .card-progress-fill {
    background: linear-gradient(90deg, #a8926a, #e8d5b0);
  }
  .dhikr-card.quran-card .tap-btn {
    border-color: var(--quran-border-strong);
  }

  .dhikr-card.quran-card .surah-label {
    font-size: 11px;
    color: #e8d5b0;
    background: rgba(210,185,130,0.08);
    border: 1px solid rgba(210,185,130,0.35);
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    margin-bottom: 8px;
    font-family: 'Amiri', serif;
    letter-spacing: 0.5px;
  }

  .card-inner {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .card-content { flex: 1; min-width: 0; }

  .dhikr-number {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-family: monospace;
    border: 1px solid var(--border-gold);
    display: inline-block;
    padding: 1px 7px;
    border-radius: 20px;
  }

  .dhikr-text {
    font-family: 'Scheherazade New', serif;
    font-size: 20px;
    line-height: 2;
    color: var(--text-cream);
    transition: color 0.3s;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .dhikr-card.done .dhikr-text {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--done-border);
  }

  .repeat-tag {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-gold-soft);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .repeat-tag::before { content: '◈'; font-size: 10px; color: var(--gold-dark); }

  .count-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    width: 54px;
  }

  .undo-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(192,148,58,0.3);
    background: rgba(192,148,58,0.06);
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }
  .undo-btn:active {
    border-color: rgba(192,148,58,0.7);
    color: var(--gold-light);
    background: rgba(192,148,58,0.15);
  }

  .tap-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1.5px solid var(--border-gold-strong);
    background: linear-gradient(145deg, #231a08, #1a1208);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }
  .tap-btn:active { transform: scale(0.92); }

  .tap-btn.done-btn {
    background: linear-gradient(145deg, #0d1a0d, #0a140a);
    border-color: var(--done-border);
    cursor: default;
  }

  .btn-count {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1;
    font-family: 'Scheherazade New', serif;
  }
  .btn-total { font-size: 10px; color: var(--text-muted); line-height: 1; margin-top: 1px; }
  .btn-check { font-size: 20px; color: var(--done-text); }

  .btn-label {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.3;
  }
  .btn-label.done-label { color: var(--done-text); }

  .card-progress {
    margin-top: 10px;
    height: 3px;
    background: rgba(192,148,58,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .card-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-mid));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .dhikr-card.done .card-progress-fill { background: var(--done-text); }

  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(3); opacity: 0; }
  }
  .ripple-circle {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(192,148,58,0.3);
    animation: ripple 0.4s ease-out forwards;
    pointer-events: none;
  }

  /* ── All Done Banner ── */
  .all-done-banner {
    display: none;
    margin: 20px 16px;
    text-align: center;
    padding: 24px 20px;
    border-radius: 20px;
    font-family: 'Scheherazade New', serif;
    font-size: 20px;
    letter-spacing: 1px;
    line-height: 1.8;
  }

  .all-done-banner.morning-done {
    display: block;
    background: linear-gradient(135deg, rgba(245,200,66,0.1), rgba(192,148,58,0.08));
    border: 1px solid rgba(245,200,66,0.3);
    color: var(--morning-color);
  }

  .all-done-banner.evening-done {
    display: block;
    background: linear-gradient(135deg, rgba(123,159,212,0.1), rgba(80,100,160,0.08));
    border: 1px solid rgba(123,159,212,0.3);
    color: var(--evening-color);
  }

  /* ── Section wrapper (show/hide) ── */
  .section-wrap { display: none; }
  .section-wrap.visible { display: block; }

  /* ── History Tab ── */
  .history-section {
    padding: 16px;
  }

  .history-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-family: 'Scheherazade New', serif;
    font-size: 16px;
    line-height: 2;
  }

  .history-day {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }

  .history-day::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--gold-mid), transparent);
    border-radius: 0 16px 16px 0;
  }

  .history-day.full-done::before {
    background: linear-gradient(180deg, var(--done-text), transparent);
  }

  .history-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .history-date-label {
    font-family: 'Scheherazade New', serif;
    font-size: 15px;
    color: var(--text-cream);
    font-weight: 600;
  }

  .history-streak {
    font-size: 18px;
  }

  .history-bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .history-bar-label {
    font-size: 12px;
    color: var(--text-muted);
    width: 60px;
    flex-shrink: 0;
    text-align: right;
  }

  .history-bar-track {
    flex: 1;
    height: 8px;
    background: rgba(192,148,58,0.1);
    border-radius: 6px;
    overflow: hidden;
  }

  .history-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.6s ease;
  }

  .history-bar-fill.morning { background: linear-gradient(90deg, #8a6520, #f5c842); }
  .history-bar-fill.evening { background: linear-gradient(90deg, #3a5080, #7b9fd4); }

  .history-bar-pct {
    font-size: 12px;
    font-weight: 700;
    width: 36px;
    flex-shrink: 0;
    text-align: left;
  }

  .history-bar-pct.morning { color: var(--morning-color); }
  .history-bar-pct.evening { color: var(--evening-color); }

  .history-streak-row {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-gold-soft);
    font-family: 'Scheherazade New', serif;
  }

  .streak-card {
    background: var(--bg-card2);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .streak-number {
    font-family: 'Scheherazade New', serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1;
  }

  .streak-info strong {
    display: block;
    font-size: 13px;
    color: var(--text-cream);
    font-family: 'Scheherazade New', serif;
  }

  .streak-info span {
    font-size: 11px;
    color: var(--text-muted);
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gold-deep); border-radius: 2px; }

  @media (max-width: 360px) {
    .dhikr-text { font-size: 18px; }
    .app-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="app-wrap">

  <div class="top-bar">
    <div class="top-title-row">
      <div style="width:70px;flex-shrink:0;"></div>
      <div class="title-center">
        <div class="app-title">أذكاري</div>
        <div class="date-display" id="dateDisplay"></div>
      </div>
      <div style="width:70px;flex-shrink:0;"></div>
    </div>

    <!-- وقت الصباح / المساء / السجل -->
    <div class="time-toggle">
      <button class="time-btn morning" id="btnMorning" onclick="switchTime('morning')">
        🌅 أذكار الصباح
      </button>
      <button class="time-btn evening" id="btnEvening" onclick="switchTime('evening')">
        🌙 أذكار المساء
      </button>
      <button class="time-btn" id="btnHistory" onclick="switchTime('history')" style="color:var(--text-muted);">
        📅 السجل
      </button>
    </div>

    <div class="progress-summary">
      <div class="progress-ring-wrap">
        <svg class="progress-ring" width="44" height="44" viewBox="0 0 44 44">
          <circle class="ring-bg" cx="22" cy="22" r="18"/>
          <circle class="ring-fill" id="ringFill" cx="22" cy="22" r="18"
            stroke-dasharray="113.1" stroke-dashoffset="113.1"/>
        </svg>
        <div class="ring-text" id="ringPct">0%</div>
      </div>
      <div class="progress-label">
        <strong id="summaryText">ابدأ أذكارك اليوم</strong>
        <span id="summaryDetail">لم يُكتمَل أي ذكر بعد</span>
      </div>
    </div>
  </div>

  <!-- ══ قسم الصباح ══ -->
  <div class="section-wrap" id="morningSection">
    <!-- القرآن الكريم -->
    <div class="section-header quran">
      <div class="section-line"></div>
      <div class="section-title-wrap">
        <span class="section-icon">📖</span>
        من القرآن الكريم
      </div>
      <div class="section-line"></div>
    </div>
    <div class="cards-list" id="cardsListQuran"></div>

    <!-- السنة النبوية -->
    <div class="section-header sunnah">
      <div class="section-line"></div>
      <div class="section-title-wrap">
        <span class="section-icon">🌙</span>
        من السنة النبوية
      </div>
      <div class="section-line"></div>
    </div>
    <div class="cards-list" id="cardsListSunnahMorning"></div>

    <div class="all-done-banner" id="morningDoneBanner">
      ﷽<br>أتممتَ أذكار الصباح 🌅<br><span style="font-size:14px;opacity:0.8">تقبّل الله منك</span>
    </div>
  </div>

  <!-- ══ قسم المساء ══ -->
  <div class="section-wrap" id="eveningSection">
    <div class="section-header sunnah">
      <div class="section-line"></div>
      <div class="section-title-wrap">
        <span class="section-icon">🌙</span>
        من السنة النبوية
      </div>
      <div class="section-line"></div>
    </div>
    <div class="cards-list" id="cardsListSunnahEvening"></div>

    <div class="all-done-banner" id="eveningDoneBanner">
      ﷽<br>أتممتَ أذكار المساء 🌙<br><span style="font-size:14px;opacity:0.8">تقبّل الله منك</span>
    </div>
  </div>
  <!-- ══ قسم السجل ══ -->
  <div class="section-wrap" id="historySection">

// ── Storage helpers ──────────────────────────────────────────────
const BASE_KEY = 'adhkari_v3';

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(BASE_KEY);
    const all = raw ? JSON.parse(raw) : {};
    const today = todayKey();
    return all[today] || { morning: {}, evening: {} };
  } catch(e) { return { morning: {}, evening: {} }; }
}

function loadAllHistory() {
  try {
    const raw = localStorage.getItem(BASE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveState(s) {
  try {
    const raw = localStorage.getItem(BASE_KEY);
    const all = raw ? JSON.parse(raw) : {};
    all[todayKey()] = s;
    localStorage.setItem(BASE_KEY, JSON.stringify(all));
  } catch(e) {}
}

// ── App state ────────────────────────────────────────────────────
let state = loadState();
let currentTime = 'morning'; // 'morning' | 'evening'

// ── Helpers ──────────────────────────────────────────────────────
function getMax(d) {
  return d.alt ? Math.max(d.total, d.alt) : d.total;
}

function getLabel(d) {
  if (d.alt) return `${Math.min(d.total,d.alt)} أو ${Math.max(d.total,d.alt)} مرات`;
  if (d.total === 1) return 'مرة واحدة';
  return `${d.total} مرات`;
}

function isMorningDone() {
  const all = [...quranAdhkar, ...sunnahAdhkar];
  return all.every(d => (state.morning[d.id]||0) >= getMax(d));
}

function isEveningDone() {
  return sunnahAdhkar.every(d => (state.evening[d.id]||0) >= getMax(d));
}

// ── Date display ─────────────────────────────────────────────────
function updateDateDisplay() {
  const d = new Date();
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  document.getElementById('dateDisplay').textContent =
    `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ── Switch between morning / evening ─────────────────────────────
function switchTime(t) {
  currentTime = t;
  document.getElementById('morningSection').classList.toggle('visible', t === 'morning');
  document.getElementById('eveningSection').classList.toggle('visible', t === 'evening');
  document.getElementById('historySection').classList.toggle('visible', t === 'history');
  document.getElementById('btnMorning').classList.toggle('active', t === 'morning');
  document.getElementById('btnEvening').classList.toggle('active', t === 'evening');
  document.getElementById('btnHistory').classList.toggle('active', t === 'history');

  // ألوان التبويب
  document.getElementById('btnHistory').className =
    'time-btn' + (t === 'history' ? ' active history-active' : '');

  if (t === 'history') {
    renderHistory();
    // إخفاء شريط التقدم في السجل
    document.querySelector('.progress-summary').style.opacity = '0.3';
  } else {
    document.querySelector('.progress-summary').style.opacity = '1';
    updateSummary();
  }
}

// ── Calc percent for a day record ─────────────────────────────────
function calcDayPct(dayData) {
  if (!dayData) return { morning: 0, evening: 0 };
  const mList = [...quranAdhkar, ...sunnahAdhkar];
  const eList = sunnahAdhkar;
  const mDone = mList.filter(d => (dayData.morning?.[d.id]||0) >= getMax(d)).length;
  const eDone = eList.filter(d => (dayData.evening?.[d.id]||0) >= getMax(d)).length;
  return {
    morning: Math.round((mDone / mList.length) * 100),
    evening: Math.round((eDone / eList.length) * 100),
  };
}

// ── Format date key to Arabic ─────────────────────────────────────
function formatDayLabel(key) {
  const [y, m, d] = key.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${days[date.getDay()]} ${d} ${months[m-1]} ${y}`;
}

// ── Render history ─────────────────────────────────────────────────
function renderHistory() {
  const allData = loadAllHistory();
  const today = todayKey();
  const container = document.getElementById('historyContent');
  container.innerHTML = '';

  // ترتيب الأيام من الأحدث للأقدم
  const keys = Object.keys(allData)
    .filter(k => /^\d{4}-\d{1,2}-\d{1,2}$/.test(k))
    .sort((a, b) => b.localeCompare(a));

  if (keys.length === 0) {
    container.innerHTML = `<div class="history-empty">📅<br>لا يوجد سجل بعد<br><span style="font-size:13px">ابدأ أذكارك اليوم ليظهر هنا</span></div>`;
    return;
  }

  // حساب streak (أيام متتالية أكمل فيها الصباح)
  let streak = 0;
  const sortedAsc = [...keys].sort();
  for (let i = sortedAsc.length - 1; i >= 0; i--) {
    const pct = calcDayPct(allData[sortedAsc[i]]);
    if (pct.morning === 100) streak++;
    else break;
  }

  // بطاقة الـ streak
  if (streak > 0) {
    const sc = document.createElement('div');
    sc.className = 'streak-card';
    sc.innerHTML = `
      <div class="streak-number">${streak}</div>
      <div class="streak-info">
        <strong>${streak === 1 ? 'يوم متتالي' : `أيام متتالية`} 🔥</strong>
        <span>أكملت أذكار الصباح كاملة</span>
      </div>
    `;
    container.appendChild(sc);
  }

  // بطاقة كل يوم
  keys.forEach(key => {
    const dayData = allData[key];
    const pct = calcDayPct(dayData);
    const fullDone = pct.morning === 100 && pct.evening === 100;

    const card = document.createElement('div');
    card.className = 'history-day' + (fullDone ? ' full-done' : '');

    const emoji = pct.morning === 100 && pct.evening === 100 ? '✨' :
                  pct.morning === 100 ? '🌅' :
                  pct.morning > 0 ? '🔸' : '○';

    card.innerHTML = `
      <div class="history-day-header">
        <div class="history-date-label">${formatDayLabel(key)}</div>
        <div class="history-streak">${emoji}</div>
      </div>
      <div class="history-bars">
        <div class="history-bar-row">
          <div class="history-bar-label">الصباح 🌅</div>
          <div class="history-bar-track">
            <div class="history-bar-fill morning" style="width:${pct.morning}%"></div>
          </div>
          <div class="history-bar-pct morning">${pct.morning}%</div>
        </div>
        <div class="history-bar-row">
          <div class="history-bar-label">المساء 🌙</div>
          <div class="history-bar-track">
            <div class="history-bar-fill evening" style="width:${pct.evening}%"></div>
          </div>
          <div class="history-bar-pct evening">${pct.evening}%</div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// ── Progress ring ─────────────────────────────────────────────────
function updateSummary() {
  let list, done, total;
  if (currentTime === 'morning') {
    list = [...quranAdhkar, ...sunnahAdhkar];
    done = list.filter(d => (state.morning[d.id]||0) >= getMax(d)).length;
  } else {
    list = sunnahAdhkar;
    done = list.filter(d => (state.evening[d.id]||0) >= getMax(d)).length;
  }
  total = list.length;
  const pct = Math.round((done/total)*100);
  const circ = 113.1;
  document.getElementById('ringFill').style.strokeDashoffset = circ - (circ * pct / 100);
  document.getElementById('ringPct').textContent = pct + '%';

  const mDone = isMorningDone();
  const eDone = isEveningDone();

  // شارات التبويب
  document.getElementById('btnMorning').innerHTML =
    `🌅 أذكار الصباح${mDone ? ' <span class="done-badge">✓</span>' : ''}`;
  document.getElementById('btnEvening').innerHTML =
    `🌙 أذكار المساء${eDone ? ' <span class="done-badge">✓</span>' : ''}`;

  // نص التقدم
  if (done === 0) {
    document.getElementById('summaryText').textContent = currentTime === 'morning' ? 'ابدأ أذكار الصباح' : 'ابدأ أذكار المساء';
    document.getElementById('summaryDetail').textContent = 'لم يُكتمَل أي ذكر بعد';
  } else if (done === total) {
    document.getElementById('summaryText').textContent = 'أتممتَ جميع الأذكار';
    document.getElementById('summaryDetail').textContent = 'تقبّل الله منك 🌟';
  } else {
    document.getElementById('summaryText').textContent = `أُكمِل ${done} من أصل ${total}`;
    document.getElementById('summaryDetail').textContent = `تبقّى ${total - done} ذكر`;
  }

  // بانر الاكتمال
  const mBanner = document.getElementById('morningDoneBanner');
  const eBanner = document.getElementById('eveningDoneBanner');
  mBanner.className = 'all-done-banner' + (mDone ? ' morning-done' : '');
  eBanner.className = 'all-done-banner' + (eDone ? ' evening-done' : '');
}

// ── Build card ────────────────────────────────────────────────────
function buildCard(d, isQuran, timeKey) {
  const max = getMax(d);
  const cur = state[timeKey][d.id] || 0;
  const isDone = cur >= max;
  const pct = Math.min(100, Math.round((cur/max)*100));
  const sectionDone = timeKey === 'morning' ? isMorningDone() : isEveningDone();

  const card = document.createElement('div');
  card.className = 'dhikr-card' + (isQuran ? ' quran-card' : '') + (isDone ? ' done' : '');

  const surahLine = isQuran && d.surah
    ? `<div class="surah-label">📖 ${d.surah}</div>`
    : '';

  // إذا اكتمل الوقت كله، الأزرار لا تعمل
  const btnDisabled = sectionDone || isDone;

  card.innerHTML = `
    <div class="card-inner">
      <div class="card-content">
        ${surahLine}
        <div class="dhikr-text">${d.text}</div>
        <div class="repeat-tag">${getLabel(d)}</div>
        <div class="card-progress">
          <div class="card-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="count-side">
        <button class="tap-btn ${isDone ? 'done-btn' : ''}"
          onclick="${btnDisabled ? '' : `tap('${d.id}','${timeKey}',this)`}"
          style="${btnDisabled && !isDone ? 'cursor:default;opacity:0.5;' : ''}"
          aria-label="اضغط لتسجيل">
          ${isDone
            ? `<span class="btn-check">✓</span>`
            : `<span class="btn-count">${cur}</span><span class="btn-total">/${max}</span>`
          }
        </button>
        <span class="btn-label ${isDone ? 'done-label' : ''}">
          ${isDone ? 'تم ✓' : (cur === 0 ? 'اضغط' : `بقي ${max - cur}`)}
        </span>
        ${cur > 0 && !sectionDone ? `<button class="undo-btn" onclick="untap('${d.id}','${timeKey}')" title="تراجع">↩</button>` : '<div style="height:26px"></div>'}
      </div>
    </div>
  `;
  return card;
}

// ── Render ────────────────────────────────────────────────────────
function renderCards() {
  // صباح: قرآن + سنة
  const qList = document.getElementById('cardsListQuran');
  const smList = document.getElementById('cardsListSunnahMorning');
  qList.innerHTML = '';
  smList.innerHTML = '';
  quranAdhkar.forEach(d => qList.appendChild(buildCard(d, true, 'morning')));
  sunnahAdhkar.forEach(d => smList.appendChild(buildCard(d, false, 'morning')));

  // مساء: سنة فقط
  const seList = document.getElementById('cardsListSunnahEvening');
  seList.innerHTML = '';
  sunnahAdhkar.forEach(d => seList.appendChild(buildCard(d, false, 'evening')));

  updateSummary();
}

// ── Tap ───────────────────────────────────────────────────────────
function tap(id, timeKey, btn) {
  // لو الوقت اكتمل كله، لا تضيف
  const sectionDone = timeKey === 'morning' ? isMorningDone() : isEveningDone();
  if (sectionDone) return;

  const list = timeKey === 'morning' ? [...quranAdhkar, ...sunnahAdhkar] : sunnahAdhkar;
  const d = list.find(a => String(a.id) === String(id));
  if (!d) return;

  const max = getMax(d);
  const cur = state[timeKey][id] || 0;
  if (cur >= max) return;

  const ripple = document.createElement('div');
  ripple.className = 'ripple-circle';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 400);

  state[timeKey][id] = cur + 1;
  saveState(state);
  renderCards();

  // تمرير لأول ذكر غير مكتمل
  if (state[timeKey][id] >= max) {
    setTimeout(() => {
      const cards = document.querySelectorAll(`#${timeKey === 'morning' ? 'morningSection' : 'eveningSection'} .dhikr-card:not(.done)`);
      if (cards.length > 0) cards[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
}

// ── Untap (تراجع) ─────────────────────────────────────────────────
function untap(id, timeKey) {
  const sectionDone = timeKey === 'morning' ? isMorningDone() : isEveningDone();
  if (sectionDone) return; // لو اكتمل الوقت كله لا تراجع
  const cur = state[timeKey][id] || 0;
  if (cur <= 0) return;
  state[timeKey][id] = cur - 1;
  if (state[timeKey][id] === 0) delete state[timeKey][id];
  saveState(state);
  renderCards();
}

// ── Init ──────────────────────────────────────────────────────────
updateDateDisplay();
renderCards();
switchTime('morning');
</script>
