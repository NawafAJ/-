<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أذكاري">
<meta name="theme-color" content="#1a1208">
<title>أذكاري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-light: #f0d080;
    --gold-mid: #c9973a;
    --gold-dark: #8a6520;
    --gold-deep: #5c4010;
    --bg-deep: #0e0b05;
    --bg-card: #17120a;
    --bg-card2: #1f1810;
    --border-gold: rgba(192,148,58,0.25);
    --border-gold-strong: rgba(192,148,58,0.5);
    --text-gold: #e8c46a;
    --text-gold-soft: #b8944a;
    --text-cream: #f5ead8;
    --text-muted: #7a6840;
    --done-bg: #0d1a0d;
    --done-border: rgba(80,160,80,0.3);
    --done-text: #5fba5f;
    --quran-accent: #e8d5b0;
    --quran-accent-soft: #a8926a;
    --quran-border: rgba(210,185,130,0.22);
    --quran-border-strong: rgba(210,185,130,0.42);
    --quran-bg: #100e08;
    --quran-bg-card: #1a1610;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    font-family: 'Amiri', serif;
    color: var(--text-cream);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(192,148,58,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 100%, rgba(192,148,58,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: 30px;
  }

  /* ── Sticky Top Bar ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0e0b05;
    border-bottom: 1px solid var(--border-gold);
    padding: 12px 16px;
  }

  .top-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .title-center {
    flex: 1;
    text-align: center;
  }

  .app-title {
    font-family: 'Scheherazade New', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(192,148,58,0.4);
    line-height: 1.2;
  }

  .app-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border-gold);
    color: var(--text-muted);
    font-family: 'Amiri', serif;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 30px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .reset-btn:active { border-color: var(--gold-mid); color: var(--gold-light); }

  .reset-placeholder { width: 70px; flex-shrink: 0; }

  /* ── Progress Summary ── */
  .progress-summary {
    background: var(--bg-card2);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-ring-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .progress-ring { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--gold-deep); stroke-width: 4; }
  .ring-fill { fill: none; stroke: var(--gold-mid); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold-light);
  }

  .progress-label { flex: 1; }
  .progress-label strong {
    display: block;
    font-size: 13px;
    color: var(--text-cream);
    font-family: 'Scheherazade New', serif;
  }
  .progress-label span { font-size: 11px; color: var(--text-muted); }

  /* ── Section Headers ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 16px 14px;
  }

  .section-line {
    flex: 1;
    height: 1px;
  }

  .section-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 30px;
    font-family: 'Scheherazade New', serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* Quran section */
  .section-header.quran .section-line {
    background: linear-gradient(90deg, transparent, #a8926a, transparent);
  }
  .section-header.quran .section-title-wrap {
    background: rgba(210,185,130,0.07);
    border: 1px solid rgba(210,185,130,0.38);
    color: #e8d5b0;
  }
  .section-icon { font-size: 18px; }

  /* Sunnah section */
  .section-header.sunnah .section-line {
    background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
  }
  .section-header.sunnah .section-title-wrap {
    background: rgba(192,148,58,0.08);
    border: 1px solid var(--border-gold-strong);
    color: var(--gold-light);
  }

  /* ── Dhikr Cards ── */
  .cards-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dhikr-card {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 16px;
    transition: border-color 0.3s, background 0.3s, opacity 0.3s;
    position: relative;
    overflow: hidden;
  }

  .dhikr-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(180deg, var(--gold-mid), transparent);
    border-radius: 0 16px 16px 0;
  }

  .dhikr-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
    opacity: 0.75;
  }

  .dhikr-card.done::before {
    background: linear-gradient(180deg, var(--done-text), transparent);
  }

  /* Quran cards */
  .dhikr-card.quran-card {
    background: var(--quran-bg-card);
    border-color: var(--quran-border);
  }
  .dhikr-card.quran-card::before {
    background: linear-gradient(180deg, #e8d5b0, transparent);
  }
  .dhikr-card.quran-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }
  .dhikr-card.quran-card .dhikr-number {
    border-color: var(--quran-border-strong);
    color: var(--quran-accent-soft);
  }
  .dhikr-card.quran-card .dhikr-text {
    color: #f0e6cc;
  }
  .dhikr-card.quran-card .repeat-tag {
    color: var(--quran-accent-soft);
  }
  .dhikr-card.quran-card .repeat-tag::before {
    color: var(--quran-accent-soft);
  }
  .dhikr-card.quran-card .card-progress-fill {
    background: linear-gradient(90deg, #a8926a, #e8d5b0);
  }
  .dhikr-card.quran-card .tap-btn {
    border-color: var(--quran-border-strong);
  }

  .dhikr-card.quran-card .surah-label {
    font-size: 11px;
    color: #e8d5b0;
    background: rgba(210,185,130,0.08);
    border: 1px solid rgba(210,185,130,0.35);
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    margin-bottom: 8px;
    font-family: 'Amiri', serif;
    letter-spacing: 0.5px;
  }

  .card-inner {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .card-content { flex: 1; min-width: 0; }

  .dhikr-number {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-family: monospace;
    border: 1px solid var(--border-gold);
    display: inline-block;
    padding: 1px 7px;
    border-radius: 20px;
  }

  .dhikr-text {
    font-family: 'Scheherazade New', serif;
    font-size: 20px;
    line-height: 2;
    color: var(--text-cream);
    transition: color 0.3s;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .dhikr-card.done .dhikr-text {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--done-border);
  }

  .repeat-tag {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-gold-soft);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .repeat-tag::before { content: '◈'; font-size: 10px; color: var(--gold-dark); }

  /* ── Count Button ── */
  .count-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    width: 54px;
  }

  .tap-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1.5px solid var(--border-gold-strong);
    background: linear-gradient(145deg, #231a08, #1a1208);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }
  .tap-btn:active { transform: scale(0.92); }

  .tap-btn.done-btn {
    background: linear-gradient(145deg, #0d1a0d, #0a140a);
    border-color: var(--done-border);
    cursor: default;
  }

  .btn-count {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1;
    font-family: 'Scheherazade New', serif;
  }
  .btn-total { font-size: 10px; color: var(--text-muted); line-height: 1; margin-top: 1px; }
  .btn-check { font-size: 20px; color: var(--done-text); }

  .btn-label {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.3;
  }
  .btn-label.done-label { color: var(--done-text); }

  .card-progress {
    margin-top: 10px;
    height: 3px;
    background: rgba(192,148,58,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .card-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-mid));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .dhikr-card.done .card-progress-fill { background: var(--done-text); }




  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(3); opacity: 0; }
  }
  .ripple-circle {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(192,148,58,0.3);
    animation: ripple 0.4s ease-out forwards;
    pointer-events: none;
  }

  .all-done-banner {
    display: none;
    text-align: center;
    padding: 20px;
    color: var(--gold-light);
    font-family: 'Scheherazade New', serif;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .all-done-banner.show { display: block; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gold-deep); border-radius: 2px; }

  @media (max-width: 360px) {
    .dhikr-text { font-size: 18px; }
    .app-title { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="app-wrap">

  <div class="top-bar">
    <div class="top-title-row">
      <div class="reset-placeholder"></div>
      <div class="title-center">
        <div class="app-title">أذكاري</div>
        <div class="app-subtitle">أذكار الصباح والمساء</div>
      </div>
      <button class="reset-btn" onclick="resetAll()">↺ إعادة</button>
    </div>
    <div class="progress-summary">
      <div class="progress-ring-wrap">
        <svg class="progress-ring" width="44" height="44" viewBox="0 0 44 44">
          <circle class="ring-bg" cx="22" cy="22" r="18"/>
          <circle class="ring-fill" id="ringFill" cx="22" cy="22" r="18"
            stroke-dasharray="113.1" stroke-dashoffset="113.1"/>
        </svg>
        <div class="ring-text" id="ringPct">0%</div>
      </div>
      <div class="progress-label">
        <strong id="summaryText">ابدأ أذكارك اليوم</strong>
        <span id="summaryDetail">لم تُكمَل أي ذكر بعد</span>
      </div>
    </div>
  </div>

  <!-- ══ قسم القرآن الكريم ══ -->
  <div class="section-header quran">
    <div class="section-line"></div>
    <div class="section-title-wrap">
      <span class="section-icon">📖</span>
      من القرآن الكريم
    </div>
    <div class="section-line"></div>
  </div>

  <div class="cards-list" id="cardsListQuran"></div>

  <!-- ══ قسم أذكار السنة ══ -->
  <div class="section-header sunnah">
    <div class="section-line"></div>
    <div class="section-title-wrap">
      <span class="section-icon">🌙</span>
      من السنة النبوية
    </div>
    <div class="section-line"></div>
  </div>

  <div class="cards-list" id="cardsListSunnah"></div>

  <div class="all-done-banner" id="allDoneBanner">
    ﷽<br>تقبّل الله منك 🌙
  </div>

</div>



<script>
const quranAdhkar = [
  {
    id: 'q1',
    surah: 'سورة الفاتحة',
    text: 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ مَالِكِ يَوْمِ الدِّينِ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ',
    total: 1
  },
  {
    id: 'q2',
    surah: 'سورة الإخلاص',
    text: 'قُلْ هُوَ اللَّهُ أَحَدٌ ٱللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌ',
    total: 3
  },
  {
    id: 'q3',
    surah: 'سورة الفلق',
    text: 'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ',
    total: 3
  },
  {
    id: 'q4',
    surah: 'سورة الناس',
    text: 'قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَٰهِ النَّاسِ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ',
    total: 3
  },
  {
    id: 'q5',
    surah: 'سورة البقرة — آية السحر والحسد',
    text: 'وَاتَّبَعُوا مَا تَتْلُو الشَّيَاطِينُ عَلَىٰ مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ وَمَا أُنزِلَ عَلَى الْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَا إِنَّمَا نَحْنُ فِتْنَةٌ فَلَا تَكْفُرْ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِ بَيْنَ الْمَرْءِ وَزَوْجِهِ وَمَا هُم بِضَارِّينَ بِهِ مِنْ أَحَدٍ إِلَّا بِإِذْنِ اللَّهِ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَلَقَدْ عَلِمُوا لَمَنِ اشْتَرَاهُ مَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ وَلَبِئْسَ مَا شَرَوْا بِهِ أَنفُسَهُمْ لَوْ كَانُوا يَعْلَمُونَ',
    total: 1
  },
  {
    id: 'q6',
    surah: 'سورة آل عمران — الحفظ والحماية',

    total: 1
  },
  {
    id: 'q7',
    surah: 'سورة يونس',
    text: 'وَإِن يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ وَإِن يُرِدْكَ بِخَيْرٍ فَلَا رَادَّ لِفَضْلِهِ يُصِيبُ بِهِ مَن يَشَاءُ مِنْ عِبَادِهِ وَهُوَ الْغَفُورُ الرَّحِيمُ',
    total: 1
  },
  {

const KEY = 'adhkari_gold_v2';

function getMax(d) {
  if (d.alt) return Math.max(d.total, d.alt);
  return d.total;
}

function getLabel(d) {
  if (d.alt) return `${Math.min(d.total,d.alt)} أو ${Math.max(d.total,d.alt)} مرات`;
  if (d.total === 1) return 'مرة واحدة';
  return `${d.total} مرات`;
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e) { return {}; }
}

function saveState(s) {
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {}
}

let state = loadState();

const allAdhkar = [...quranAdhkar, ...sunnahAdhkar];

function updateSummary() {
  const total = allAdhkar.length;
  let done = 0;
  allAdhkar.forEach(d => { if ((state[d.id]||0) >= getMax(d)) done++; });
  const pct = Math.round((done/total)*100);
  const circ = 113.1;
  const offset = circ - (circ * pct / 100);

  document.getElementById('ringFill').style.strokeDashoffset = offset;
  document.getElementById('ringPct').textContent = pct + '%';

  if (done === 0) {
    document.getElementById('summaryText').textContent = 'ابدأ أذكارك اليوم';
    document.getElementById('summaryDetail').textContent = 'لم يُكتمَل أي ذكر بعد';
  } else if (done === total) {
    document.getElementById('summaryText').textContent = 'أتممتَ جميع الأذكار';
    document.getElementById('summaryDetail').textContent = 'تقبّل الله منك 🌙';
    document.getElementById('allDoneBanner').classList.add('show');
  } else {
    document.getElementById('summaryText').textContent = `أُكمِل ${done} من أصل ${total}`;
    document.getElementById('summaryDetail').textContent = `تبقّى ${total - done} ذكر`;
    document.getElementById('allDoneBanner').classList.remove('show');
  }
}

function buildCard(d, isQuran) {
  const max = getMax(d);
  const cur = state[d.id] || 0;
  const isDone = cur >= max;
  const pct = Math.min(100, Math.round((cur/max)*100));

  const card = document.createElement('div');
  card.className = 'dhikr-card' + (isQuran ? ' quran-card' : '') + (isDone ? ' done' : '');

  const surahLine = isQuran && d.surah
    ? `<div class="surah-label">📖 ${d.surah}</div>`
    : `<div class="dhikr-number">ذكر ${d.id}</div>`;

  card.innerHTML = `
    <div class="card-inner">
      <div class="card-content">
        ${surahLine}
        <div class="dhikr-text">${d.text}</div>
        <div class="repeat-tag">${getLabel(d)}</div>
        <div class="card-progress">
          <div class="card-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="count-side">
        <button class="tap-btn ${isDone ? 'done-btn' : ''}" onclick="tap('${d.id}', this)" aria-label="اضغط لتسجيل">
          ${isDone
            ? `<span class="btn-check">✓</span>`
            : `<span class="btn-count">${cur}</span><span class="btn-total">/${max}</span>`
          }
        </button>
        <span class="btn-label ${isDone ? 'done-label' : ''}">
          ${isDone ? 'تم ✓' : (cur === 0 ? 'اضغط' : `بقي ${max - cur}`)}
        </span>
      </div>
    </div>
  `;
  return card;
}

function renderCards() {
  const qList = document.getElementById('cardsListQuran');
  const sList = document.getElementById('cardsListSunnah');
  qList.innerHTML = '';
  sList.innerHTML = '';

  quranAdhkar.forEach(d => qList.appendChild(buildCard(d, true)));
  sunnahAdhkar.forEach(d => sList.appendChild(buildCard(d, false)));

  updateSummary();
}

function tap(id, btn) {
  const d = allAdhkar.find(a => String(a.id) === String(id));
  const max = getMax(d);
  const cur = state[id] || 0;
  if (cur >= max) return;

  const ripple = document.createElement('div');
  ripple.className = 'ripple-circle';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 400);

  state[id] = cur + 1;
  saveState(state);
  renderCards();

  if (state[id] >= max) {
    setTimeout(() => {
      const cards = document.querySelectorAll('.dhikr-card:not(.done)');
      if (cards.length > 0) cards[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
}

function resetAll() {
  if (confirm('هل تريد إعادة ضبط جميع الأذكار؟')) {
    state = {};
    saveState(state);
    document.getElementById('allDoneBanner').classList.remove('show');
    renderCards();
  }
}

renderCards();
</script>
